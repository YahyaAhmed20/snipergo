
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SNIPER GO - Wallet Deposit</title>
</head>
<body>
    <h1>SNIPER GO</h1>
    <h2>Request Cash Deposit</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <p>
        Submit a cash deposit request. Your wallet will not be credited
        until an administrator confirms the deposit.
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Submit Deposit Request</button>
    </form>

    <p>
        <a href="{% url 'accounts:dashboard' %}">
            Back to Dashboard
        </a>
    </p>
</body>
</html>
