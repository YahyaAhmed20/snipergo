
{% extends "admin/base_site.html" %}

{% block content %}
<h1>Reject vehicle: {{ vehicle.plate_number }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Confirm rejection</button>
    <a href="{% url 'admin:vehicles_vehicle_changelist' %}">
        Cancel
    </a>
</form>
{% endblock %}
