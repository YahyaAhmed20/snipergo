{% extends "admin/base_site.html" %}

{% block content %}
<h1>Reject captain: {{ captain.user.username }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Confirm rejection</button>
    <a href="{% url 'admin:accounts_captainprofile_changelist' %}">
        Cancel
    </a>
</form>
{% endblock %}
